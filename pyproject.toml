[project]
name = "clasp-ont"
version = "0.1.0"
description = "Certified Lattice ASP Solver and Patching for Multi-Ontology Biological Hubs"
readme = "SPEC.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "oaklib>=0.7.4",
    "sssom>=0.4.22",
    "sssom-schema>=1.1.0a5",
    "sssom-pydantic>=0.6.10",
    "kgcl-schema>=0.6.0",
    "rdflib>=7.1.0",
    "curies>=0.9.0",
    "py-horned-owl>=2.0.0",
    "clingo>=5.8.2",
    "duckdb>=1.1.0",
    "polars>=1.12.0",
    "networkx>=3.4",
    "datasets>=3.1.0",
    "huggingface-hub>=0.26.0",
    "jsonschema>=4.23.0",
    "pydantic>=2.10",
    "pyyaml>=6.0.2",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "plotly>=5.24.0",
    "kaleido>=1.0.0",
    "matplotlib>=3.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "snakemake>=9.0.0",
]

[project.scripts]
clasp-ont = "clasp_ont.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clasp_ont"]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
